{% extends "adminpanel/base.html" %}
{% block page_content %}
<form action="" method="post">
    {% csrf_token %}
    <div class="row d-sm-flex align-items-center justify-content-between">
        <div class="col-md-12">
            <a href="{% url 'admin-support' %}" class="btn btn-primary float-end"><i class="fas fa-arrow-left-long"></i> Back to Tickets</a>
            <h1 class="h3 mb-0 text-dark"><i class="fas fa-hand-holding-medical"></i> Open Support Ticket</h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{% url 'admin-dashboard-home' %}">Admin Dashboard</a></li>
                    <li class="breadcrumb-item"><a href="{% url 'admin-support' %}">Support Tickets</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Open Support Ticket</li>
                </ol>
            </nav>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <div class="card text-dark mb-3">
                <div class="card-header">
                    <h5 class="card-title text-white float-left">New Support Ticket ({{ TICKETS|length }} Total)</h5>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="ticket-subject">Subject <small class="text-danger">required</small> - <small>Short description of the problem.</small></label>
                        <input class="form-control" name="ticket-subject" id="ticket-subject" required="required"/>
                    </div>
                    <div class="form-group">
                        <label for="ticket-category">Category <small class="text-danger">required</small> - <small>What kind of problem are you having?</small></label>
                        <select class="form-select" name="ticket-category" id="ticket-category" required="required">
                            {% for category in CATEGORIES %}
                                <option value="{{ category.id }}" {% if forloop.counter == 1 %}selected="selected"{% endif %}>{{ category.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="ticket-message">Message <small class="text-danger">required</small> - <small>Detailed description and information about your problem or request.</small></label>
                        <textarea class="form-control" name="ticket-message" id="ticket-message" rows="10" required="required"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="ticket-attachments" class="form-label">Attachments <small class="text-danger">optional</small> - <small>Screenshots, Log files, etc.</small></label>
                        <input class="form-control" type="file" id="ticket-attachments" name="ticket-attachments" multiple>
                    </div>
                    <button type="submit" class="btn btn-primary float-end">Open Support Ticket</button>
                </div>
            </div>
        </div>
    </div>
</form>
{% endblock %}
