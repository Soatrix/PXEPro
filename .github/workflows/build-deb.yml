name: Build and Publish .deb for PXE Pro

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  build-deb-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: snapshot

      - name: Set up Debian Packaging Tools
        run: |
          sudo apt update
          sudo apt install -y build-essential devscripts debhelper dpkg-dev python3-venv git

      - name: Build Debian Package (Snapshot)
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          PKG_NAME="pxepro-snapshot"
          INSTALL_DIR="/var/www/pxepro"

          mkdir -p $PKG_NAME-deb/DEBIAN
          mkdir -p $PKG_NAME-deb/$INSTALL_DIR
          mkdir -p $PKG_NAME-deb/usr/lib/systemd/system/


          cat <<EOF > $PKG_NAME-deb/DEBIAN/control
          Package: $PKG_NAME
          Version: $VERSION
          Architecture: amd64
          Maintainer: Soatrix NZ Ltd. <contact@soatrix.com>
          Depends: ufw, sudo, make, unzip, git, gcc, binutils, zlib1g-dev, genisoimage, liblzma-dev, dnsmasq, python3-dev, python3-venv, targetcli-fb, nginx, zfsutils-linux, chntpw, ntfs-3g
          Description: PXE Pro - Diskless Boot Solution (Snapshot Version)
          EOF

          rsync -a --exclude=$PKG_NAME-deb --exclude=.git --exclude=.github --exclude=node_modules ./ $PKG_NAME-deb/$INSTALL_DIR/

          cat <<EOF > $PKG_NAME-deb/usr/lib/systemd/system/pxepro.service
          [Unit]
          Description=PXE Pro Diskless Boot Solution
          After=network.target

          [Service]
          User=pxepro
          Group=pxepro
          WorkingDirectory=$INSTALL_DIR
          ExecStart=$INSTALL_DIR/venv/bin/waitress-serve --unix-socket=$INSTALL_DIR/server.sock app.wsgi:application
          ExecStartPost=/bin/chmod 660 $INSTALL_DIR/server.sock
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF

          chmod 644 $PKG_NAME-deb/usr/lib/systemd/system/pxepro.service

          cat <<'EOF' > $PKG_NAME-deb/DEBIAN/postinst
          #!/bin/bash
          set -e

          INSTALL_DIR="/var/www/pxepro"

          # Create pxepro user and group if not exist
          if ! id -u pxepro >/dev/null 2>&1; then
            useradd -r -s /bin/bash -d $INSTALL_DIR -m -U pxepro
          fi

          # Set ownership
          chown -R pxepro:pxepro $INSTALL_DIR

          # Create venv and install Python deps# Create venv and install Python deps
          cd $INSTALL_DIR
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          
          # Apply migrations and create default superuser
          $INSTALL_DIR/venv/bin/python <<PYTHON_EOF
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "app.settings")

          import django
          from django.core.management import call_command

          django.setup()

          # Run migrations
          call_command("migrate", interactive=False)

          # Create default superuser if it doesn't exist
          from django.contrib.auth import get_user_model
          User = get_user_model()

          if not User.objects.filter(username="pxepro").exists():
              User.objects.create_superuser("pxepro", "pxepro@localhost", "disklessboot")
          PYTHON_EOF

          # iPXE build
          if [ -d /tmp/ipxe ]; then
            if [ -d /tmp/ipxe/.git ]; then
              cd /tmp/ipxe
              git reset --hard
              git clean -fd
              git pull origin master
            else
              rm -rf /tmp/ipxe
              git clone https://github.com/ipxe/ipxe.git /tmp/ipxe
            fi
          else
            git clone https://github.com/ipxe/ipxe.git /tmp/ipxe
          fi

          ls -l $INSTALL_DIR
          cp $INSTALL_DIR/pxepro.ipxe /tmp/ipxe/src/
          cd /tmp/ipxe/src

          mkdir -p /var/lib/peboot /var/lib/tftpboot

          if [ ! -f /var/lib/tftpboot/undionly.kpxe ]; then
            make bin/undionly.kpxe EMBED=pxepro.ipxe
            mv bin/undionly.kpxe /var/lib/tftpboot/
          fi

          if [ ! -f /var/lib/tftpboot/ipxe.efi ]; then
            make bin-x86_64-efi/ipxe.efi EMBED=pxepro.ipxe
            mv bin-x86_64-efi/ipxe.efi /var/lib/tftpboot/
          fi

          chown -R pxepro:pxepro /var/lib/tftpboot

          # Give pxepro user passwordless sudo for key commands
          echo "pxepro ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/pxepro        
          chmod 440 /etc/sudoers.d/pxepro

          # Configure NGINX
          mv $INSTALL_DIR/pxepro.conf /etc/nginx/conf.d/
          rm -rf /etc/nginx/sites-available/default
          rm -rf /etc/nginx/sites-enabled/default
          systemctl restart nginx

          # Helper to safely add UFW rule
          add_ufw_rule() {
            local PORT_PROTO="$1"
            local COMMENT="$2"
            if ! ufw status | grep -qw "$PORT_PROTO"; then
              ufw allow "$PORT_PROTO" comment "$COMMENT"
            fi
          }

          add_ufw_rule "22/tcp" "SSH Access"
          add_ufw_rule "67/udp" "DHCP (dnsmasq)"
          add_ufw_rule "69/udp" "TFTP (dnsmasq)"
          add_ufw_rule "4011/udp" "ProxyDHCP (dnsmasq)"
          add_ufw_rule "80/tcp" "HTTP Boot (nginx)"
          add_ufw_rule "3260/tcp" "iSCSI (targetcli)"

          if ! ufw status | grep -q "Status: active"; then
            yes | ufw enable
          fi
          
          usermod -aG www-data pxepro
          usermod -aG pxepro www-data
          
          mkdir -p /run/pxepro
          chown pxepro:www-data /run/pxepro
          chmod 770 /run/pxepro

          systemctl daemon-reload
          systemctl enable nginx --now
          systemctl enable dnsmasq --now
          systemctl enable pxepro
          systemctl restart pxepro
          
          chown pxepro:www-data /run/pxepro/server.sock
          chmod 660 /run/pxepro/server.sock
          
          chown -R www-data:www-data $INSTALL_DIR
          
          EOF

          chmod 755 $PKG_NAME-deb/DEBIAN/postinst
          dpkg-deb --build $PKG_NAME-deb pxepro-snapshot_${VERSION}_amd64.deb

      - name: Upload Package as Artifact (Snapshot)
        uses: actions/upload-artifact@v4
        with:
          name: pxepro-deb-snapshot
          path: pxepro-snapshot_${{ github.event.release.tag_name }}_amd64.deb
          
      - name: Upload Snapshot Package as Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./pxepro-snapshot_${{ github.event.release.tag_name }}_amd64.deb
          asset_name: pxepro-snapshot_${{ github.event.release.tag_name }}_amd64.deb
          asset_content_type: application/octet-stream



  build-deb-enterprise:
    runs-on: ubuntu-latest
    needs: build-deb-snapshot

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: enterprise

      - name: Set up Debian Packaging Tools
        run: |
          sudo apt update
          sudo apt install -y build-essential devscripts debhelper dpkg-dev python3-venv git

      - name: Build Debian Package (enterprise)
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          PKG_NAME="pxepro-enterprise"
          INSTALL_DIR="/var/www/pxepro"

          mkdir -p $PKG_NAME-deb/DEBIAN
          mkdir -p $PKG_NAME-deb/$INSTALL_DIR
          mkdir -p $PKG_NAME-deb/usr/lib/systemd/system/

          cat <<EOF > $PKG_NAME-deb/DEBIAN/control
          Package: $PKG_NAME
          Version: $VERSION
          Architecture: amd64
          Maintainer: Soatrix NZ Ltd. <contact@soatrix.com>
          Depends: ufw, sudo, make, unzip, git, gcc, binutils, zlib1g-dev, genisoimage, liblzma-dev, dnsmasq, python3-dev, python3-venv, targetcli-fb, nginx, zfsutils-linux, chntpw, ntfs-3g
          Description: PXE Pro - Diskless Boot Solution (Enterprise Version)
          EOF

          rsync -a --exclude=$PKG_NAME-deb --exclude=.git --exclude=.github --exclude=node_modules ./ $PKG_NAME-deb/$INSTALL_DIR/

          cat <<EOF > $PKG_NAME-deb/usr/lib/systemd/system/pxepro.service
          [Unit]
          Description=PXE Pro Diskless Boot Solution
          After=network.target

          [Service]
          User=pxepro
          Group=pxepro
          WorkingDirectory=$INSTALL_DIR
          ExecStart=$INSTALL_DIR/venv/bin/waitress-serve --unix-socket=$INSTALL_DIR/server.sock app.wsgi:application
          ExecStartPost=/bin/chmod 660 $INSTALL_DIR/server.sock
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF

          chmod 644 $PKG_NAME-deb/usr/lib/systemd/system/pxepro.service

          cat <<'EOF' > $PKG_NAME-deb/DEBIAN/postinst
          #!/bin/bash
          set -e

          INSTALL_DIR="/var/www/pxepro"

          # Create pxepro user and group if not exist
          if ! id -u pxepro >/dev/null 2>&1; then
            useradd -r -s /bin/bash -d $INSTALL_DIR -m -U pxepro
          fi

          # Set ownership
          chown -R pxepro:pxepro $INSTALL_DIR

          # Create venv and install Python deps
          cd $INSTALL_DIR
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

          # Apply migrations and create default superuser
          $INSTALL_DIR/venv/bin/python <<PYTHON_EOF
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "app.settings")

          import django
          from django.core.management import call_command

          django.setup()

          # Run migrations
          call_command("migrate", interactive=False)

          # Create default superuser if it doesn't exist
          from django.contrib.auth import get_user_model
          User = get_user_model()

          if not User.objects.filter(username="pxepro").exists():
              User.objects.create_superuser("pxepro", "pxepro@localhost", "fireport")
          PYTHON_EOF

          # iPXE build
          if [ -d /tmp/ipxe ]; then
            if [ -d /tmp/ipxe/.git ]; then
              cd /tmp/ipxe
              git reset --hard
              git clean -fd
              git pull origin master
            else
              rm -rf /tmp/ipxe
              git clone https://github.com/ipxe/ipxe.git /tmp/ipxe
            fi
          else
            git clone https://github.com/ipxe/ipxe.git /tmp/ipxe
          fi

          ls -l $INSTALL_DIR
          cp $INSTALL_DIR/pxepro.ipxe /tmp/ipxe/src/
          cd /tmp/ipxe/src

          mkdir -p /var/lib/peboot /var/lib/tftpboot

          if [ ! -f /var/lib/tftpboot/undionly.kpxe ]; then
            make bin/undionly.kpxe EMBED=pxepro.ipxe
            mv bin/undionly.kpxe /var/lib/tftpboot/
          fi

          if [ ! -f /var/lib/tftpboot/ipxe.efi ]; then
            make bin-x86_64-efi/ipxe.efi EMBED=pxepro.ipxe
            mv bin-x86_64-efi/ipxe.efi /var/lib/tftpboot/
          fi

          chown -R pxepro:pxepro /var/lib/tftpboot

          # Give pxepro user passwordless sudo for key commands
          echo "pxepro ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/pxepro        
          chmod 440 /etc/sudoers.d/pxepro

          # Configure NGINX
          mv $INSTALL_DIR/pxepro.conf /etc/nginx/conf.d/
          rm -rf /etc/nginx/sites-available/default
          rm -rf /etc/nginx/sites-enabled/default
          systemctl restart nginx

          # Helper to safely add UFW rule
          add_ufw_rule() {
            local PORT_PROTO="$1"
            local COMMENT="$2"
            if ! ufw status | grep -qw "$PORT_PROTO"; then
              ufw allow "$PORT_PROTO" comment "$COMMENT"
            fi
          }

          add_ufw_rule "22/tcp" "SSH Access"
          add_ufw_rule "67/udp" "DHCP (dnsmasq)"
          add_ufw_rule "69/udp" "TFTP (dnsmasq)"
          add_ufw_rule "4011/udp" "ProxyDHCP (dnsmasq)"
          add_ufw_rule "80/tcp" "HTTP Boot (nginx)"
          add_ufw_rule "3260/tcp" "iSCSI (targetcli)"

          if ! ufw status | grep -q "Status: active"; then
            yes | ufw enable
          fi
          
          usermod -aG www-data pxepro
          usermod -aG pxepro www-data

          systemctl daemon-reload
          systemctl enable nginx --now
          systemctl enable dnsmasq --now
          systemctl enable pxepro
          systemctl restart pxepro
          
          chown pxepro:www-data /run/pxepro/server.sock
          chmod 660 /run/pxepro/server.sock
          
          chown -R www-data:www-data $INSTALL_DIR
          
          EOF

          chmod 755 $PKG_NAME-deb/DEBIAN/postinst
          dpkg-deb --build $PKG_NAME-deb pxepro-enterprise_${VERSION}_amd64.deb

      - name: Upload Package as Artifact (enterprise)
        uses: actions/upload-artifact@v4
        with:
          name: pxepro-deb-enterprise
          path: pxepro-enterprise_${{ github.event.release.tag_name }}_amd64.deb
          
      - name: Upload Enterprise Package as Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./pxepro-enterprise_${{ github.event.release.tag_name }}_amd64.deb
          asset_name: pxepro-enterprise_${{ github.event.release.tag_name }}_amd64.deb
          asset_content_type: application/octet-stream
          
  deploy-apt-repo:
      runs-on: ubuntu-latest
      needs: [build-deb-snapshot, build-deb-enterprise]

      steps:
        - name: Set up Git
          run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions@github.com"

        - name: Clone gh-pages branch
          run: |
            git clone --depth=1 --branch=gh-pages https://github.com/Soatrix/PXEPro gh-pages

        - name: Download Built Packages
          uses: actions/download-artifact@v4
          with:
            path: artifacts

        - name: Move .deb files into APT repository
          run: |
            mkdir -p gh-pages/pool/main/p/pxepro
            cp artifacts/pxepro-deb-snapshot/*.deb gh-pages/pool/main/p/pxepro/
            cp artifacts/pxepro-deb-enterprise/*.deb gh-pages/pool/main/p/pxepro/

        - name: Regenerate Packages.gz
          run: |
            cd gh-pages
            mkdir -p dists/stable/main/binary-amd64
            dpkg-scanpackages --arch amd64 pool/main/p/pxepro /dev/null | gzip -9c > dists/stable/main/binary-amd64/Packages.gz

        - name: Commit and Push Changes
          env:
            TOKEN: ${{ secrets.TOKEN }}
          run: |
            cd gh-pages
            git add .
            git commit -m "Update APT repository with new Snapshot and Enterprise packages" || echo "No changes to commit"
            git push https://github-actions:${TOKEN}@github.com/Soatrix/PXEPro.git gh-pages