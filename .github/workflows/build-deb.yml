name: Build and Publish .deb for PXE Pro

on:
  push:
    branches:
      - snapshot

  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Debian Packaging Tools
        run: |
          sudo apt update
          sudo apt install -y build-essential devscripts debhelper dpkg-dev python3-venv

      - name: Build Debian Package
        run: |
          VERSION="1.0.0"
          PKG_NAME="pxepro"
          INSTALL_DIR="/var/www/pxepro"
          SERVICE_FILE="/etc/systemd/system/pxepro.service"

          # Create package structure
          mkdir -p $PKG_NAME-deb/DEBIAN
          mkdir -p $PKG_NAME-deb/$INSTALL_DIR
          mkdir -p $PKG_NAME-deb/usr/lib/systemd/system/

          # Control file
          cat <<EOF > $PKG_NAME-deb/DEBIAN/control
          Package: $PKG_NAME
          Version: $VERSION
          Architecture: amd64
          Maintainer: Soatrix NZ Ltd. <contact@soatrix.com>
          Depends: make, unzip, git, gcc, binutils, zlib1g-dev, genisoimage, liblzma-dev, dnsmasq, python3-dev, python3-venv, targetcli-fb, nginx, zfsutils-linux
          Description: PXE Pro - Diskless Boot Solution
          EOF

          # Copy project files, excluding the package directory itself and others that shouldn't be in the .deb
          rsync -a --exclude=$PKG_NAME-deb --exclude=.git --exclude=.github --exclude=node_modules ./ $PKG_NAME-deb/$INSTALL_DIR/

          # Systemd service file
          cat <<EOF > $PKG_NAME-deb/usr/lib/systemd/system/pxepro.service
          [Unit]
          Description=PXE Pro Diskless Boot Solution
          After=network.target

          [Service]
          User=www-data
          Group=www-data
          WorkingDirectory=$INSTALL_DIR
          ExecStart=$INSTALL_DIR/venv/bin/waitress-serve --unix-socket=$INSTALL_DIR/server.sock app.wsgi:application
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF

          chmod 644 $PKG_NAME-deb/usr/lib/systemd/system/pxepro.service

          # Post-install script (set up venv)
          cat <<EOF > $PKG_NAME-deb/DEBIAN/postinst
          #!/bin/bash
          set -e
          chown -R www-data:www-data $INSTALL_DIR
          cd $INSTALL_DIR
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          systemctl daemon-reload
          systemctl enable pxepro
          systemctl restart pxepro
          EOF

          chmod 755 $PKG_NAME-deb/DEBIAN/postinst

          # Build .deb package
          dpkg-deb --build $PKG_NAME-deb pxepro_${VERSION}_amd64.deb

      - name: Upload Package as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pxepro-deb
          path: pxepro_1.0.0_amd64.deb

      - name: Deploy to GitHub Pages (APT Repository)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          git clone --depth=1 --branch=gh-pages https://github.com/Soatrix/PXEPro gh-pages
          cd gh-pages

          # Ensure required directory structure exists
          mkdir -p dists/stable/main/binary-amd64
          mkdir -p pool/main/p/pxepro

          # Move .deb package to 'pool'
          mv ../pxepro_1.0.0_amd64.deb pool/main/p/pxepro/

          # Generate Packages.gz safely
          dpkg-scanpackages --arch amd64 pool/main/p/pxepro /dev/null | gzip -9c > dists/stable/main/binary-amd64/Packages.gz

          git add .
          git commit -m "Update APT repository with new PXE Pro .deb" || echo "No changes to commit"
          git push
