            EOF

            chmod 755 $PKG_NAME-deb/DEBIAN/postinst
            dpkg-deb --build $PKG_NAME-deb pxepro-enterprise_${VERSION}_amd64.deb

        - name: Upload Package as Artifact (Enterprise)
          uses: actions/upload-artifact@v4
          with:
            name: pxepro-deb-enterprise
            path: pxepro-enterprise_${{ github.event.release.tag_name }}_amd64.deb

  deploy-apt-repo:
      runs-on: ubuntu-latest
      needs: [build-deb-snapshot, build-deb-enterprise]

      steps:
        - name: Set up Git
          run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions@github.com"

        - name: Clone gh-pages branch
          run: |
            git clone --depth=1 --branch=gh-pages https://github.com/Soatrix/PXEPro gh-pages

        - name: Download Built Packages
          uses: actions/download-artifact@v4
          with:
            path: artifacts

        - name: Move .deb files into APT repository
          run: |
            mkdir -p gh-pages/pool/main/p/pxepro
            cp artifacts/pxepro-deb-snapshot/*.deb gh-pages/pool/main/p/pxepro/
            cp artifacts/pxepro-deb-enterprise/*.deb gh-pages/pool/main/p/pxepro/

        - name: Regenerate Packages.gz
          run: |
            cd gh-pages
            mkdir -
