          chmod 755 $PKG_NAME-deb/DEBIAN/postinst

          # Build .deb package
          dpkg-deb --build $PKG_NAME-deb pxepro_${VERSION}_amd64.deb

      - name: Upload Package as Artifact (Enterprise)
        uses: actions/upload-artifact@v4
        with:
          name: pxepro-deb-enterprise
          path: pxepro-enterprise_${{ github.event.release.tag_name }}_amd64.deb

      - name: Deploy to GitHub Pages (APT Repository)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          git clone --depth=1 --branch=gh-pages https://github.com/Soatrix/PXEPro gh-pages
          cd gh-pages

          # Ensure required directory structure exists
          mkdir -p dists/stable/main/binary-amd64
          mkdir -p pool/main/p/pxepro

          mv ../pxepro-enterprise_${{ github.event.release.tag_name }}_amd64.deb pool/main/p/pxepro/

          # Generate Packages.gz safely
          dpkg-scanpackages --arch amd64 pool/main/p/pxepro /dev/null | gzip -9c > dists/stable/main/binary-amd64/Packages.gz

          git add .
          git commit -m "Update APT repository with new PXE Pro Enterprise .deb" || echo "No changes to commit"
          git push https://github-actions:${{ secrets.TOKEN }}@github.com/Soatrix/PXEPro.git
